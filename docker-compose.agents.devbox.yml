# Три агента Woodpecker на devbox.
#
# Сервер остаётся на NAS. Достучаться до него отсюда напрямую нельзя — он за
# домашним NAT, gRPC-порт наружу не смотрит. Поэтому NAS сам держит обратный
# SSH-туннель на этот сервер (контейнер devbox-tunnel на NAS), и порт 9000
# появляется здесь на docker-мосту 172.17.0.1 — адрес, который видят
# контейнеры агентов.
#
# По тому же туннелю на порту 2222 доступен sshd самого NAS: шаг deploy
# заливает туда образ, как раньше это делал агент на Маке.
name: woodpecker-agents

services:
  agent-1: &agent
    image: woodpeckerci/woodpecker-agent:v3
    command: agent
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agent-1-config:/etc/woodpecker
    environment:
      # сервер на NAS, через обратный туннель
      WOODPECKER_SERVER: 172.17.0.1:9000
      WOODPECKER_GRPC_SECRET: ${WOODPECKER_GRPC_SECRET}
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET}
      # Один workflow на агента: три параллельных пайплайна на хост.
      WOODPECKER_MAX_WORKFLOWS: 1
      # Лимиты на контейнеры шагов. Без них один разогнавшийся jest на этом
      # хосте уже убивал всё вокруг (2026-08-28); с продом на той же машине
      # это недопустимо. 8 GiB на шаг, свопа нет (swap == mem), три агента по
      # одному workflow — худший случай 24 GiB из 61. Сборки образов через
      # сокет идут в buildkit на хосте и под этот лимит не попадают.
      # 4 GiB было мало: тестовый шаг luna-atlas (turbo гонит тесты пакетов
      # параллельно, 11 воркеров) упирался в потолок и получал OOM-kill
      # (2026-09-12 20:36, пайплайн 509).
      #
      # 2026-09-16, агентов стало пять. Арифметика «худший случай» из абзаца
      # выше изменилась и стоит того, чтобы её проговорить: 5 x 8 GiB = 40 GiB
      # из 61, и это на хосте, где idle-потребление в тот день было 41 GiB
      # (стеки luna staging/production/burst, стек denitsa staging, vscode-server,
      # два nest --watch, netdata и сессии Claude). Пять шагов, одновременно
      # упёршихся в свой потолок, хост не переживёт — раньше это было
      # 24 GiB и запас был настоящим. Если начнутся OOM-kill'ы на шагах,
      # первое, что надо трогать, — это число ниже, а не лимит.
      WOODPECKER_BACKEND_DOCKER_LIMIT_MEM: 8589934592
      WOODPECKER_BACKEND_DOCKER_LIMIT_MEM_SWAP: 8589934592
    # Сам агент — маленький gRPC-клиент; 512 MiB ему за глаза.
    mem_limit: 512m
    container_name: woodpecker-agent-1

  agent-2:
    <<: *agent
    container_name: woodpecker-agent-2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agent-2-config:/etc/woodpecker

  agent-3:
    <<: *agent
    container_name: woodpecker-agent-3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agent-3-config:/etc/woodpecker

  # Четвёртый и пятый были здесь два дня — 2026-09-16 по решению владельца,
  # 2026-09-18 по его же решению убраны.
  #
  # Замер 16-го говорил, что очереди за агентом нет (медиана ожидания между
  # created и started — 5 секунд по последним 25 пайплайнам denitsa-app), и
  # что два лишних контейнера только поднимают число пайплайнов, идущих
  # одновременно на 16 ядрах. Замер 18-го показал, во что это вылилось:
  # load average 21.7 на 16 ядрах, и один и тот же шаг в одном и том же коде
  # — clone за 6 секунд или за 8 минут, test за 9 секунд или за 12 минут,
  # build-staging за 5 минут или за 19 — в зависимости только от того,
  # сколько пайплайнов шло рядом. Пайплайны с одним соседом укладывались в
  # 15–18 минут, с тремя-четырьмя — в 34–52. Пять агентов не дали пять
  # пайплайнов за время одного; они дали пять пайплайнов за время трёх.
  # Если очередь когда-нибудь появится по-настоящему, ответ — второй хост,
  # а не четвёртый агент на этом.

volumes:
  agent-1-config:
  agent-2-config:
  agent-3-config:
